version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: printbot_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printbot_backend
    restart: always
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-printbot}
      - SECRET_KEY=${SECRET_KEY:-printbot_super_secret_jwt_key_change_in_production_2026}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-EAAG...}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-100000000000000}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-printbot_verify_token_2026}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_key_id}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_test_key_secret}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_2026}
      - CUPS_HOST=${CUPS_HOST:-host.docker.internal}
      - USE_VIRTUAL_PRINTER=${USE_VIRTUAL_PRINTER:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: printbot_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

