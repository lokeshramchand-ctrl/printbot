version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printbot_backend
    restart: always
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-printbot}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - ENV=${ENV:-development}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - PAYMENT_MODE=${PAYMENT_MODE:-demo}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin123}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - CUPS_HOST=${CUPS_HOST:-host.docker.internal}
      - USE_VIRTUAL_PRINTER=${USE_VIRTUAL_PRINTER:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: printbot_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

